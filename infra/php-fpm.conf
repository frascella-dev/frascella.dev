; php-fpm clears the environment for its workers by default, which would mean
; `Env::get()` — and therefore every DB_* and MAIL_* setting compose passes in —
; seeing nothing. Turning that off is what lets the container be configured by
; environment alone, with no .env file inside the image.
;
; On the real server the opposite holds: CloudPanel's pool keeps the default,
; and the app reads app/.env. Both paths work because Env prefers real
; environment variables and falls back to the file.
[www]
clear_env = no
