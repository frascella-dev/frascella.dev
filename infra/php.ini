; Close to what CloudPanel's PHP-FPM ships, so the container is not quietly
; more permissive than production.

expose_php = Off
memory_limit = 128M
post_max_size = 2M
upload_max_filesize = 2M
max_execution_time = 30

; The API logs to stderr — `error_log()` calls in Contact, Analytics and Admin
; end up in `docker compose logs`.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Europe/Rome

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
