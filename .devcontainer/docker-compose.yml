# Two-service dev environment for the portfolio monorepo.
# `client` runs the Vite SPA, `server` runs the NestJS API. Both mount the
# repo at /workspace; each pins its node_modules to a named volume so host
# and container dependency trees stay separate and fast.
services:
    client:
        image: node:20-bookworm
        container_name: portfolio-client
        working_dir: /workspace/services/site-v2
        volumes:
            - ../:/workspace:cached
            - client-node-modules:/workspace/services/site-v2/node_modules
        ports:
            - "5173:5173"
        environment:
            VITE_API_URL: http://localhost:3000
        command: sleep infinity
        networks:
            - portfolio

    server:
        image: node:20-bookworm
        container_name: portfolio-server
        working_dir: /workspace/services/api
        volumes:
            - ../:/workspace:cached
            - server-node-modules:/workspace/services/api/node_modules
        ports:
            - "3000:3000"
        environment:
            PORT: "3000"
            NODE_ENV: development
            CORS_ORIGINS: http://localhost:5173
        command: sleep infinity
        networks:
            - portfolio

networks:
    portfolio:
        driver: bridge

volumes:
    client-node-modules:
        driver: local
    server-node-modules:
        driver: local
