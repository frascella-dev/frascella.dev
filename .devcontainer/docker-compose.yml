services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                WWWUSER: "1000"
                WWWGROUP: "1000"
        container_name: portfolio-app
        volumes:
            - ../:/var/www/html:cached
        working_dir: /var/www/html
        ports:
            - "8000:8000"
            - "5173:5173"
        networks:
            - portfolio
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: portfolio
            DB_USERNAME: laravel
            DB_PASSWORD: secret
        command: sleep infinity

    mysql:
        image: mysql:8.0
        container_name: portfolio-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: portfolio
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - portfolio
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: portfolio-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
            UPLOAD_LIMIT: 256M
        ports:
            - "8080:80"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - portfolio

networks:
    portfolio:
        driver: bridge

volumes:
    mysql-data:
        driver: local
