# The whole portfolio as it is deployed, plus the MySQL it can be pointed at.
#
#   docker compose up --build        → http://localhost:8080
#   docker compose exec app sh       → poke around the CloudPanel layout
#   docker compose down -v           → and forget the database
#
# The image is built from the repository root (see `context` below) because it
# compiles both services; the Dockerfile explains the layout it produces.

name: portfolio

services:
    db:
        image: mysql:8.4
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: portfolio
            MYSQL_USER: portfolio
            MYSQL_PASSWORD: portfolio
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            # The app waits again on its own side; this is what keeps compose
            # from starting it against a server that is still initialising.
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 3s
            timeout: 5s
            retries: 30
            start_period: 30s
        volumes:
            - db-data:/var/lib/mysql
        # Exposed so a client on the host can look at what the API wrote.
        ports:
            - "13306:3306"

    app:
        build:
            context: ..
            dockerfile: infra/Dockerfile
        depends_on:
            db:
                condition: service_healthy
        environment:
            APP_ENV: development
            APP_TIMEZONE: Europe/Rome

            # Same-origin in this layout, so CORS is never exercised. Set it
            # to http://localhost:5173 to point a local `npm run dev` here.
            CORS_ORIGINS: http://localhost:5173

            DB_DRIVER: mysql
            DB_HOST: db
            DB_PORT: "3306"
            DB_DATABASE: portfolio
            DB_USERNAME: portfolio
            DB_PASSWORD: portfolio

            ANALYTICS_RETENTION_DAYS: "400"

            # The entrypoint creates this account on first boot if the users
            # table is empty, and prints its TOTP secret and recovery codes to
            # the log. Throwaway environment only — on the server you run
            # `bin/admin-user.php create` yourself and nobody but you sees the
            # secret. Two-factor is required here too:
            #
            #   docker compose -f infra/docker-compose.yml logs app | grep secret
            #
            ADMIN_EMAIL: owner@frascella.dev
            ADMIN_NAME: Emanuele
            ADMIN_PASSWORD: dashboard-please

            # Unset, so the contact form logs instead of sending.
            MAIL_HOST: ""
            MAIL_FROM_ADDRESS: hello@frascella.dev
            MAIL_TO_ADDRESS: hello@frascella.dev
        ports:
            - "8080:80"

volumes:
    db-data:
