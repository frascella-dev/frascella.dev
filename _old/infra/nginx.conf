# nginx, shaped like CloudPanel's vhost rather than like a convenient
# container config.
#
# CloudPanel puts two servers in front of a PHP site: a public one that
# terminates TLS and proxies, and one on 8080 that actually executes PHP. That
# hop is reproduced here for one reason — it is where the visitor's address
# stops being `$remote_addr` and starts being a header. `Api\Http::clientIp()`
# only trusts X-Real-IP when the peer is loopback, and this is the only way to
# find out whether that works before it is in production.
#
# The other thing worth copying is which server holds `location /api/`. It
# belongs in the PHP server. In the proxy server it would shadow the proxy pass
# and, with no PHP handler in scope, serve index.php as a static file.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_x_real_ip"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- the public server (CloudPanel's 443 block) -------------------------
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- the PHP server (CloudPanel's 8080 block) ---------------------------
    server {
        listen 8080;
        server_name _;

        root /srv/site/htdocs;
        index index.html index.php;

        # Astro builds /privacy and /admin as directory pages, so the
        # trailing-slash resolution in `$uri/` is load-bearing.
        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            try_files $uri /api/index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
        }

        # Hashed asset names, so they can be cached hard.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Belt and braces: nothing outside the document root is reachable
        # anyway, but a dotfile that ends up in it should not be served.
        location ~ /\. {
            deny all;
        }
    }
}
