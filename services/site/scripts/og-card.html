<!doctype html>
<!--
  Source for `public/og-card.png`, the 1200×630 image every link preview
  shows. Rendered by `scripts/og-card.mjs`, which screenshots this file at
  exactly that size and writes the result into `public/`.

  It is a file rather than a drawing in some external tool so the card cannot
  drift from the site: the same two typefaces off the same two woff2 files,
  the same ink ground, the same monogram. Change the site's palette and this
  is one command away from matching again.

  Not built by `npm run build` — the card changes about as often as the name
  does, and putting a headless browser in the build to redraw a static PNG
  every time would cost every build for nothing.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            @font-face {
                font-family: Gloock;
                font-style: normal;
                font-weight: 400;
                src: url("../public/fonts/gloock-latin.woff2") format("woff2");
            }

            @font-face {
                font-family: "Schibsted Grotesk";
                font-style: normal;
                font-weight: 400 600;
                src: url("../public/fonts/schibsted-grotesk-latin.woff2") format("woff2");
            }

            * {
                margin: 0;
                box-sizing: border-box;
            }

            body {
                width: 1200px;
                height: 630px;
                background: #0b0b0b;
                color: #fff;
                font-family: "Schibsted Grotesk", sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 76px 84px;
                overflow: hidden;
                position: relative;
            }

            /* The hairline rule the site draws down the left of the hero,
               here as the one piece of furniture. */
            .rule {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 1px;
                background: rgba(255, 255, 255, 0.14);
                margin-left: 42px;
            }

            .top {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .mark {
                width: 54px;
                height: 54px;
                fill: #fff;
            }

            .label {
                font-weight: 500;
                font-size: 17px;
                letter-spacing: 0.2em;
                text-transform: lowercase;
                color: rgba(255, 255, 255, 0.5);
            }

            h1 {
                font-family: Gloock, serif;
                font-weight: 400;
                font-size: 92px;
                line-height: 1.02;
                letter-spacing: -0.01em;
            }

            h1 .dim {
                color: rgba(255, 255, 255, 0.42);
            }

            .role {
                margin-top: 26px;
                font-size: 27px;
                line-height: 1.45;
                color: rgba(255, 255, 255, 0.66);
                max-width: 21ch;
            }

            .foot {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }
        </style>
    </head>
    <body>
        <div class="rule"></div>

        <div class="top">
            <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
                <path
                    d="M80.928 22.8718C96.9442 28.9201 107.794 43.4431 109.665 59.8326L98.1755 56.751C96.5179 50.0425 92.8522 43.9552 87.6777 39.3544L81.2455 63.3829L109.595 70.9865L106.805 81.4107L78.455 73.8071L68.1458 112.319L57.7316 109.526L80.928 22.8718Z"
                ></path>
                <path
                    d="M96.7848 120L86.3706 117.207L89.161 106.783L99.5752 109.576L96.7848 120Z"
                ></path>
                <path
                    d="M63.2076 47.3724L52.7934 44.5792L57.3279 27.6399L40.8388 23.2174L33.5138 50.5809L60.4171 57.7966L57.6266 68.2208L31.0879 61.1029C29.4431 75.5617 37.2165 89.5095 50.2575 95.7492L47.4304 106.31C27.1331 97.6967 15.7579 75.2138 21.6269 53.2894L33.2151 10L70.5326 20.0088L63.2076 47.3724Z"
                ></path>
            </svg>
            <span class="label" data-slot="eyebrow">frascella.dev</span>
        </div>

        <div>
            <h1 data-slot="title">Emanuele <span class="dim">Frascella</span></h1>
            <!-- His own words, off the hero lede: a link preview is not the
                 place to invent a claim the site itself does not make. -->
            <p class="role" data-slot="role">
                Software engineer in Taranto, Italy. Three industries, one constant:
                don't let the system fail.
            </p>
        </div>

        <div class="foot">
            <span class="label" data-slot="left">40.4644° n / 17.2470° e</span>
            <span class="label" data-slot="right">portfolio</span>
        </div>
    </body>
</html>
