# Every push: the PHP parses on the versions the project supports, the theme builds and
# typechecks, and the release packages can be made. The e2e tests need a running
# WordPress with Elementor and are run locally (npm test in the plugin), not here.
name: CI

on:
    push:
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ["8.2", "8.3", "8.4"]
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
            - name: Lint
              run: find wp-content tools -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

    theme:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Build and typecheck
              working-directory: wp-content/themes/frascella
              run: npm ci && npm run build && npm run typecheck
            - name: Packages
              run: bin/build-zips
