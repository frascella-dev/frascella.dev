# The site, as WordPress, on this machine.
#
#   docker compose up -d            → http://localhost:8110   (mail: http://localhost:8135)
#   bin/setup                       → first run: WordPress, Elementor, Polylang, the demo
#   bin/wp <command>                → WP-CLI on the same filesystem
#   docker compose down -v          → and forget the database
#
# WordPress core lives in a named volume: it is a dependency, not source. What is
# bind-mounted is what this project writes — the theme, the plugin, the mu-plugins —
# so an edit on the host is live in the container without a rebuild.

name: frascella

x-db-env: &db-env
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_NAME: frascella
    WORDPRESS_DB_USER: frascella
    WORDPRESS_DB_PASSWORD: frascella

x-mounts: &mounts
    - wp-core:/var/www/html
    - ./wp-content/themes/frascella:/var/www/html/wp-content/themes/frascella
    - ./wp-content/plugins/frascella:/var/www/html/wp-content/plugins/frascella
    - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    - ./tools:/var/www/html/tools:ro

services:
    db:
        image: mariadb:11
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MARIADB_DATABASE: frascella
            MARIADB_USER: frascella
            MARIADB_PASSWORD: frascella
            MARIADB_ROOT_PASSWORD: root
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        volumes:
            - db-data:/var/lib/mysql

    wp:
        image: wordpress:php8.3-apache
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8110:80"
        environment:
            <<: *db-env
            WORDPRESS_DEBUG: "1"
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_DEBUG_LOG', true);
                define('WP_DEBUG_DISPLAY', false);
                define('DISALLOW_FILE_EDIT', true);
                define('WP_ENVIRONMENT_TYPE', 'local');
        volumes: *mounts

    cli:
        image: wordpress:cli-php8.3
        # Apache's uid in the wordpress image: a file WP-CLI writes is one the site can read.
        user: "33:33"
        depends_on:
            db:
                condition: service_healthy
        environment:
            <<: *db-env
        volumes: *mounts
        entrypoint: ["wp"]
        command: ["--info"]

    # Every email the site sends ends here, and nowhere else (wp-content/mu-plugins/local-mail.php).
    mail:
        image: axllent/mailpit:latest
        ports:
            - "8135:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
    db-data:
    wp-core:
